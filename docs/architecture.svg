<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 805 480" width="805" height="480" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #555; stroke-width: 1.2; }
      .mono { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 10.5px; }
      .title { font-weight: bold; font-size: 12px; }
      .small { font-size: 10px; fill: #444; }
      .flow { stroke: #333; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .side { stroke: #b03a2e; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- data source -->
  <rect x="10" y="10" width="150" height="40" rx="6" fill="#eef1f5" stroke="#8a94a3"/>
  <text x="85" y="27" text-anchor="middle" class="title">NYC Open Data API</text>
  <text x="85" y="42" text-anchor="middle" class="small">dataset i4gi-tjb9</text>
  <path d="M85,50 V78" class="flow"/>
  <text x="92" y="68" class="small">download_data.py</text>

  <!-- producer -->
  <rect x="10" y="80" width="150" height="200" rx="8" fill="#fff7ef" stroke="#e07b00" stroke-width="2"/>
  <text x="85" y="100" text-anchor="middle" class="title">Python producer</text>
  <text x="20" y="124">data/traffic.csv</text>
  <text x="20" y="139" class="small">(one day, 36,000 rows)</text>
  <text x="20" y="162">drop faults → 21,073</text>
  <text x="20" y="182">event_time (NY → ms)</text>
  <text x="20" y="202">speed-up ×60 (1 h/min)</text>
  <text x="20" y="222">10% delayed ≤ 120 s</text>
  <text x="20" y="242">key = link_id</text>
  <text x="20" y="262">value = JSON</text>

  <!-- input topic -->
  <path d="M160,180 H178" class="flow"/>
  <rect x="180" y="120" width="100" height="120" rx="8" fill="#1f2933"/>
  <text x="230" y="140" text-anchor="middle" class="title" fill="#fff">Kafka</text>
  <rect x="188" y="150" width="84" height="80" rx="4" fill="#fff"/>
  <text x="230" y="168" text-anchor="middle" class="mono">traffic-</text>
  <text x="230" y="181" text-anchor="middle" class="mono">readings</text>
  <text x="230" y="202" text-anchor="middle" class="small">4 partitions</text>
  <text x="230" y="217" text-anchor="middle" class="small">key link_id</text>

  <!-- Flink job -->
  <rect x="300" y="10" width="320" height="360" rx="10" fill="#fff7ef" stroke="#e07b00" stroke-width="2"/>
  <text x="460" y="30" text-anchor="middle" class="title" fill="#c05f00">Flink job (Flink 2.3, Java 17)</text>
  <path d="M280,180 H290 V56 H313" class="flow"/>

  <rect x="315" y="42" width="290" height="28" rx="5" class="box"/>
  <text x="460" y="60" text-anchor="middle">KafkaSource  <tspan class="mono">--offset earliest | latest</tspan></text>
  <path d="M460,70 V78" class="flow"/>

  <rect x="315" y="80" width="290" height="38" rx="5" class="box"/>
  <text x="460" y="96" text-anchor="middle">event time = event_time; watermark =</text>
  <text x="460" y="111" text-anchor="middle">max seen − 120 s; idle partition after 30 s</text>
  <path d="M460,118 V126" class="flow"/>

  <rect x="315" y="128" width="290" height="28" rx="5" class="box"/>
  <text x="460" y="146" text-anchor="middle">LateReadingFilter: event_time ≤ watermark?</text>
  <path d="M460,156 V170" class="flow"/>

  <!-- analytics -->
  <rect x="315" y="172" width="290" height="96" rx="6" fill="#d9f2ee" stroke="#1f9e89"/>
  <text x="323" y="186" font-weight="bold" fill="#13715f">Analytics module (event-time windows)</text>
  <rect x="323" y="192" width="274" height="34" rx="4" class="box"/>
  <text x="331" y="206">keyBy link_id · sliding 15 min / 5 min</text>
  <text x="331" y="220" class="small">count, avg/min/max/stddev, free-flow, level</text>
  <rect x="323" y="230" width="274" height="34" rx="4" class="box"/>
  <text x="331" y="244">keyBy borough · tumbling 5 min</text>
  <text x="331" y="258" class="small">readings, links, avg/min/max, slow share</text>

  <!-- event driven -->
  <rect x="315" y="276" width="290" height="82" rx="6" fill="#d3e4e0" stroke="#22574c"/>
  <text x="323" y="290" font-weight="bold" fill="#22574c">Event-driven module (state + timers)</text>
  <rect x="323" y="296" width="274" height="54" rx="4" class="box"/>
  <text x="331" y="312">keyBy link_id · IncidentDetector</text>
  <text x="331" y="327" class="small">KeyedProcessFunction, ValueState&lt;LinkState&gt;,</text>
  <text x="331" y="341" class="small">event-time timers (15 min, 20 min)</text>

  <!-- output topics -->
  <rect x="635" y="100" width="160" height="270" rx="8" fill="#1f2933"/>
  <text x="715" y="120" text-anchor="middle" class="title" fill="#fff">Kafka output topics</text>
  <rect x="645" y="129" width="140" height="26" rx="4" fill="#fff"/>
  <text x="715" y="146" text-anchor="middle" class="mono">traffic-late-readings</text>
  <rect x="645" y="196" width="140" height="26" rx="4" fill="#fff"/>
  <text x="715" y="213" text-anchor="middle" class="mono">traffic-link-stats</text>
  <rect x="645" y="234" width="140" height="26" rx="4" fill="#fff"/>
  <text x="715" y="251" text-anchor="middle" class="mono">traffic-borough-stats</text>
  <rect x="645" y="310" width="140" height="26" rx="4" fill="#fff"/>
  <text x="715" y="327" text-anchor="middle" class="mono">traffic-incidents</text>

  <path d="M605,142 H643" class="side"/>
  <path d="M597,209 H643" class="flow"/>
  <path d="M597,247 H643" class="flow"/>
  <path d="M597,323 H643" class="flow"/>

  <!-- dashboard -->
  <path d="M715,370 V388" class="flow"/>
  <rect x="635" y="390" width="160" height="78" rx="8" fill="#eef1f5" stroke="#8a94a3"/>
  <text x="715" y="408" text-anchor="middle" class="title">Dashboard bridge</text>
  <text x="715" y="425" text-anchor="middle" class="small">Python, aiokafka</text>
  <text x="715" y="440" text-anchor="middle" class="small">in-memory snapshot</text>
  <text x="715" y="455" text-anchor="middle" class="small">push via Socket.IO</text>
  <path d="M635,429 H602" class="flow"/>
  <text x="618" y="421" text-anchor="middle" class="small">WS</text>
  <rect x="360" y="390" width="240" height="78" rx="8" fill="#eef1f5" stroke="#8a94a3"/>
  <text x="480" y="408" text-anchor="middle" class="title">Browser (React + MapLibre)</text>
  <text x="480" y="425" text-anchor="middle" class="small">map colored by congestion level,</text>
  <text x="480" y="440" text-anchor="middle" class="small">alert log, open incidents,</text>
  <text x="480" y="455" text-anchor="middle" class="small">borough speed charts</text>

  <!-- compose note -->
  <rect x="10" y="390" width="330" height="78" rx="8" fill="none" stroke="#8a94a3" stroke-dasharray="4 3"/>
  <text x="20" y="408" font-weight="bold">One <tspan class="mono">docker compose up -d --build</tspan></text>
  <text x="20" y="425" class="small">kafka → kafka-init (5 topics × 4 partitions)</text>
  <text x="20" y="440" class="small">jobmanager + taskmanager → flink-job (submits) → producer</text>
  <text x="20" y="455" class="small">dashboard :8000 · Flink UI :8081 · Kafka :9092</text>
</svg>
