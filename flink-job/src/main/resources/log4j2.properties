# Flink itself only logs warnings, our own classes log at INFO (config summary, skipped records)
rootLogger.level = WARN
rootLogger.appenderRef.console.ref = ConsoleAppender
appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss,SSS} %-5p %-30c{1} - %m%n
logger.traffic.name = mk.ukim.finki.rnmp.traffic
logger.traffic.level = INFO
# Harmless startup warnings of the local mini-cluster
logger.tokens.name = org.apache.flink.runtime.security.token
logger.tokens.level = ERROR
logger.webmon.name = org.apache.flink.runtime.webmonitor.WebMonitorUtils
logger.webmon.level = ERROR
logger.metrics.name = org.apache.flink.runtime.metrics.util.MetricUtils
logger.metrics.level = ERROR
# "Name collision" warnings of the Kafka sink committers
logger.metricgroup.name = org.apache.flink.metrics.MetricGroup
logger.metricgroup.level = ERROR
