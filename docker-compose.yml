# NYC traffic incident detection: the whole pipeline with one command.
#
#   docker compose up -d --build      # build the images and start everything
#   docker compose logs -f producer   # follow one service
#   docker compose down               # stop and remove the containers (Kafka topics are not kept)
#   docker compose down -v            # ... and also the empty anonymous volumes of the Kafka image
#
# Startup order (depends_on):
#   kafka (healthy) ─► kafka-init (topics created) ─┬─► flink-job (job RUNNING) ─► producer
#   jobmanager (healthy), taskmanager ──────────────┘
#   kafka-init ─► dashboard
#
# Every ${VAR:-default} can be overridden in the shell or in a .env file (see .env.example).
name: nyc-traffic

services:
  # Single-node Kafka in KRaft mode (broker + controller in one process, no ZooKeeper).
  # Same listener setup as the course stack:
  #   OUTSIDE  localhost:${KAFKA_PORT}  for programs on the host
  #   INSIDE   kafka:9093               for the other containers
  #   CONTROLLER :9094                  KRaft controller (internal)
  # The data lives inside the container, so `docker compose down` starts with empty topics next time.
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_LISTENERS: INSIDE://:9093,OUTSIDE://:9092,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics come from kafka-init, a typo must not create one
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # One-shot: creates the five topics of docs/CONTRACT.md with 4 partitions each, then exits.
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in traffic-readings traffic-link-stats traffic-borough-stats traffic-incidents traffic-late-readings; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --create --if-not-exists \
            --topic "$$topic" --partitions 4 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --describe | grep PartitionCount
    restart: "no"

  # Flink session cluster: one JobManager (web UI / REST on ${FLINK_UI_PORT}) and one TaskManager.
  jobmanager:
    image: flink:2.3.0-java17
    command: jobmanager
    ports:
      - "${FLINK_UI_PORT:-8081}:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 2
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  taskmanager:
    image: flink:2.3.0-java17
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2

  # One-shot: builds the job jar, submits it to the cluster, waits until it is RUNNING and exits.
  # Restarting it does not submit a second copy. `--offset latest` = read only what the producer
  # writes from now on (the producer starts after this container has finished).
  flink-job:
    build: ./flink-job
    depends_on:
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      JOBMANAGER: jobmanager:8081
    command:
      - --bootstrap
      - kafka:9093
      - --offset
      - ${FLINK_OFFSET:-latest}
      - --parallelism
      - ${FLINK_PARALLELISM:-2}
      - --max-ooo-s
      - ${FLINK_MAX_OOO_S:-120}
    restart: "no"

  # Replays one day of readings into traffic-readings, then exits (or forever with LOOP=true).
  # Downloads data/traffic.csv and data/links.geojson first if they are missing.
  producer:
    build: ./producer
    depends_on:
      flink-job:
        condition: service_completed_successfully
    volumes:
      - ./data:/data
    environment:
      KAFKA_BOOTSTRAP: kafka:9093
      DATA_START: ${DATA_START:-2026-10-01}
      SPEEDUP: ${SPEEDUP:-60}                 # event-time seconds per wall second (60 = 1 h per minute)
      START_AT: ${START_AT:-}                 # e.g. 06:00 to skip the night; empty = whole day
      DISORDER_RATIO: ${DISORDER_RATIO:-0.1}  # share of readings sent out of order
      MAX_DELAY_S: ${MAX_DELAY_S:-120}        # max event-time delay of such a reading
      SEED: ${SEED:-42}
      LIMIT: ${LIMIT:-0}
      LOOP: ${LOOP:-false}                    # true = replay forever, one day later each round
      RESUME: ${RESUME:-false}                # true = continue after the newest reading in the topic
    restart: "no"

  # Live dashboard (React + Python Socket.IO bridge) on http://localhost:${DASHBOARD_PORT}.
  # OFFSET=earliest: a restarted bridge rebuilds its picture from everything in the topics.
  dashboard:
    build: ./dashboard
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${DASHBOARD_PORT:-8000}:8000"
    volumes:
      - ./data:/data:ro
    environment:
      KAFKA_BOOTSTRAP: kafka:9093
      OFFSET: earliest
      LINKS_GEOJSON: /data/links.geojson
